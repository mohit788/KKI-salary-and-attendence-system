services:
  - type: web
    name: KKI-salary-and-attendance-system
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: TURSO_DATABASE_URL
        value: libsql://kki-attendance-devloperkki21.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
